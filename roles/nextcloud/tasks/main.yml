---

- import_tasks: "{{ role_path }}/tasks/setup_main.yml"
  when: nextcloud_installation_enabled|bool == true
  tags:
    - setup-all
    - setup-nextcloud

- import_tasks: "{{ role_path }}/tasks/setup_nextcloud.yml"
  when: nextcloud_installation_enabled|bool == true
  tags:
    - setup-nextcloud
    - setup-all

- import_tasks: "{{ role_path }}/tasks/start.yml"
  when: nextcloud_installation_enabled|bool == true
  tags:
    - start
    - start-nextcloud

- import_tasks: "{{ role_path }}/tasks/backup.yml"
  when: nextcloud_installation_enabled|bool == true and nextcloud_backup_enabled|bool
  tags:
    - backup
    - backup-nextcloud
