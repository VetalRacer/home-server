---
- name: Reload systemd after AWG-Forge configuration changes
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Ensure AWG-Forge service is enabled and restarted
  ansible.builtin.systemd_service:
    name: awg-forge.service
    enabled: true
    state: restarted

- name: Reload Nginx-proxy after AWG-Forge is started
  ansible.builtin.systemd_service:
    name: nginx-proxy.service
    state: reloaded
