---

- name: Ensure systemd reloaded
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Stop Nextcloud background-job timers before service restart
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop: >-
    {{
      (['nextcloud-cron.timer'] if nextcloud_cron_enabled | bool else [])
      + (['nextcloud-backup.timer'] if nextcloud_backup_enabled | bool else [])
    }}

- name: Stop active Nextcloud background jobs before service restart
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop: >-
    {{
      (['nextcloud-cron.service'] if nextcloud_cron_enabled | bool else [])
      + (['nextcloud-backup.service'] if nextcloud_backup_enabled | bool else [])
    }}

- name: Ensure Nextcloud services stopped
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  with_items: "{{ nextcloud_services_list }}"

- name: Ensure Nextcloud services started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: yes
    state: started
  with_items: "{{ nextcloud_services_list }}"

- name: Restore Nextcloud background-job timers after service restart
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: >-
    {{
      (['nextcloud-cron.timer'] if nextcloud_cron_enabled | bool else [])
      + (['nextcloud-backup.timer'] if nextcloud_backup_enabled | bool else [])
    }}

- name: Ensure Nextcloud canonical hostname is configured
  ansible.builtin.command: >-
    {{ host_command_docker }} exec --user www-data nextcloud
    php occ config:system:set overwritehost
    --value={{ nextcloud_service_hostname }} --type=string
  changed_when: false
  check_mode: false
  register: nextcloud_overwritehost_result
  retries: 12
  delay: 5
  until: nextcloud_overwritehost_result.rc == 0

- name: Ensure Nextcloud primary trusted domain is configured
  ansible.builtin.command: >-
    {{ host_command_docker }} exec --user www-data nextcloud
    php occ config:system:set trusted_domains 0
    --value={{ nextcloud_service_hostname }} --type=string
  changed_when: false
  check_mode: false
  register: nextcloud_trusted_domain_result
  retries: 12
  delay: 5
  until: nextcloud_trusted_domain_result.rc == 0
