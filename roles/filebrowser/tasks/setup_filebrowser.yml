---

- name: Validate FileBrowser configuration
  assert:
    that:
      - filebrowser_uid | int > 0
      - filebrowser_gid | int > 0
      - filebrowser_service_port | int > 0
      - filebrowser_service_port | int < 65536
      - filebrowser_root_path is match('^/datafolder/sharefolder(?:/.*)?$')
    fail_msg: >-
      Define valid non-root FileBrowser UID/GID values, a valid service port,
      and a root path inside /datafolder/sharefolder.
  no_log: true

- name: Ensure FileBrowser image is pulled
  docker_image:
    name: "{{ filebrowser_docker_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"

- name: Ensure FileBrowser paths exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
    owner: "{{ filebrowser_uid }}"
    group: "{{ filebrowser_gid }}"
  with_items:
    - "{{ filebrowser_data_path }}"
    - "{{ filebrowser_config_path }}"
    - "{{ filebrowser_database_path }}"

- name: Ensure filebrowser.service installed
  template:
    src: "{{ role_path }}/templates/filebrowser/filebrowser.service.j2"
    dest: "/etc/systemd/system/filebrowser.service"
    mode: 0644
  register: filebrowser_systemd_service_result

- name: Ensure systemd reloaded after filebrowser.service installation
  service:
    daemon_reload: yes
  when: filebrowser_systemd_service_result.changed
