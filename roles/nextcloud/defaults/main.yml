# Base directory that contains everything
nextcloud_base_data_path: "{{ services_base_data_path }}/nextcloud"

# Nextcloud edition
nextcloud_docker_image_template: "nextcloud:__VERSION__"
nextcloud_docker_image: "{{ nextcloud_docker_image_template|replace('__VERSION__', nextcloud_docker_image_tag) }}"

# Nextcloud-related data
nextcloud_main_path: "{{ nextcloud_base_data_path }}/main"
nextcloud_apps_path: "{{ nextcloud_base_data_path }}/apps"
nextcloud_config_path: "{{ nextcloud_base_data_path }}/config"
nextcloud_data_path: "{{ nextcloud_base_data_path }}/data"
nextcloud_env_path: "{{ nextcloud_base_data_path }}/nextcloud.env"
nextcloud_cron_script_path: "{{ nextcloud_base_data_path }}/nextcloud-cron.sh"
nextcloud_backup_path: "{{ backups_base_data_path }}/nextcloud"
nextcloud_backup_script_path: "{{ nextcloud_base_data_path }}/nextcloud-backup.sh"

# Nextcloud envs
nextcloud_postgres_host: "postgres"
nextcloud_postgres_db: "nextcloud"
nextcloud_postgres_bootstrap_script_path: "{{ nextcloud_base_data_path }}/postgres-bootstrap.sh"

# Nextcloud is small in this deployment, but background work should not depend
# on someone opening the web UI. The timers use systemd OnCalendar syntax.
nextcloud_cron_enabled: true
nextcloud_cron_schedule: "*:0/5:00"

# A consistent archive contains the Nextcloud database and all persistent
# bind-mounted directories. Store this path on separate storage to protect
# against loss of the primary server or disk.
nextcloud_backup_enabled: true
nextcloud_backup_schedule: "*-*-* 03:30:00"
nextcloud_backup_retention_days: 14

# Keep this empty unless the reverse proxy has a known, trusted and stable IP
# or CIDR. Hostnames are not valid values for Nextcloud trusted proxies.
nextcloud_trusted_proxies: []
nextcloud_overwrite_protocol: ""
nextcloud_overwrite_cli_url: ""

# Nextcloud services
nextcloud_services_list: |
  {{
    (['nextcloud.service'])
  }}
