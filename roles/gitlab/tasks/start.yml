---

- name: Ensure systemd reloaded
  ansible.builtin.systemd_service:
    daemon_reload: yes

- name: Ensure GitLab services stopped
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  with_items: "{{ gitlab_services_list }}"

- name: Ensure GitLab services started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: yes
    state: started
  with_items: "{{ gitlab_services_list }}"
