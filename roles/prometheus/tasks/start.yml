---

- name: Ensure systemd reloaded
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure Exporter services started
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop: "{{ exporter_services_list }}"

- name: Ensure Prometheus services started
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop: "{{ prometheus_services_list }}"
