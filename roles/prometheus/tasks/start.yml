---

- name: Ensure systemd reloaded
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure Exporter services restarted
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: restarted
  loop: "{{ exporter_services_list }}"

- name: Ensure Prometheus services restarted
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: restarted
  loop: "{{ prometheus_services_list }}"
