---

- name: Ensure backup user account created
  ansible.builtin.user:
    name: "{{ gitlab_backup_user }}"
    create_home: true

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ gitlab_backup_user }}/.ssh"
    state: directory
    owner: "{{ gitlab_backup_user }}"
    group: "{{ gitlab_backup_user }}"
    mode: '0700'

- name: Ensure backups directory exists
  ansible.builtin.file:
    path: "{{ gitlab_backup_directory }}"
    state: directory
    owner: "{{ gitlab_backup_user }}"
    group: "{{ gitlab_backup_user }}"
    mode: '0700'

- name: Ensure backup user's authorized_keys is up-to-date
  authorized_key:
    user: "{{ gitlab_backup_user }}"
    key: "{{ item }}"
  loop: "{{ gitlab_backup_user_authorized_keys }}"

- name: Ensure backup program directory exists
  ansible.builtin.file:
    path: "{{ gitlab_backup_program_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Ensure backup program installed
  ansible.builtin.template:
    src: templates/gitlab-backup/backup.sh.j2
    dest: "{{ gitlab_backup_program_install_dir }}/backup.sh"
    owner: root
    group: root
    mode: '0700'
  no_log: true

- name: Ensure cronjob installed
  ansible.builtin.template:
    src: templates/gitlab-backup/cron.d/gitlab-backup.j2
    dest: "/etc/cron.d/gitlab-backup"
    mode: 0644
