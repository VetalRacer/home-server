# Base directory that contains everything
motioneye_base_data_path: "{{ services_base_data_path }}/motioneye"

# MotionEye edition
motioneye_docker_image_template: "motioneyeproject/motioneye:__VERSION__"
motioneye_docker_image: "{{ motioneye_docker_image_template|replace('__VERSION__', motioneye_docker_image_tag) }}"

# MotionEye-related data
motioneye_config_path: "{{ motioneye_base_data_path }}/config"
motioneye_media_path: "{{ motioneye_base_data_path }}/media"
motioneye_backup_path: "{{ motioneye_base_data_path }}/backups"
motioneye_migration_backup_path: "{{ motioneye_backup_path }}/config-before-image-migration.tar.gz"

# MotionEye envs
motioneye_service_port: 8765
# Keep MotionEye's stream endpoint available to LAN clients without exposing it
# on every host interface. The web UI itself is served through nginx-proxy.
motioneye_stream_listen_address: "{{ ansible_default_ipv4.address | default('') }}"
motioneye_stream_port: 8081

# MotionEye services
motioneye_services_list: |
  {{
    (['motioneye.service'])
  }}
