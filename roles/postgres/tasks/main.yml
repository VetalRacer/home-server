---

- import_tasks: "{{ role_path }}/tasks/setup_main.yml"
  when: postgres_installation_enabled|bool == true
  tags:
    - setup-all
    - setup-postgres

- import_tasks: "{{ role_path }}/tasks/setup_postgres.yml"
  when: postgres_installation_enabled|bool == true
  tags:
    - setup-postgres
    - setup-all

- import_tasks: "{{ role_path }}/tasks/start.yml"
  when: postgres_installation_enabled|bool == true
  tags:
    - start

- import_tasks: "{{ role_path }}/tasks/setup_backup.yml"
  when:
    - postgres_installation_enabled | bool
    - postgres_backup_enabled | bool
  tags:
    - setup-all
    - setup-postgres

- import_tasks: "{{ role_path }}/tasks/backup.yml"
  when:
    - postgres_installation_enabled | bool
    - postgres_backup_enabled | bool
  tags:
    - backup
