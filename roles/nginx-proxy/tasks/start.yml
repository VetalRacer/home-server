---

- name: Ensure systemd reloaded
  service:
    daemon_reload: yes

- name: Ensure Nginx-proxy service stopped
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ nginx_proxy_services_list }}"
  when: not ansible_check_mode

- name: Ensure Nginx-proxy service started
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ nginx_proxy_services_list }}"
  when: not ansible_check_mode
