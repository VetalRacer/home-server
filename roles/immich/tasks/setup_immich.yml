---
- name: Validate Immich non-secret configuration
  ansible.builtin.assert:
    that:
      - immich_docker_image_tag | default('') is match('^[^\\s@]+$')
      - immich_postgres_docker_image_tag | default('') is match('^[^\\s]+$')
      - immich_redis_docker_image_tag | default('') is match('^[^\\s]+$')
      - immich_service_hostname | default('') is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - immich_service_port | int >= 1
      - immich_service_port | int <= 65535
      - immich_db_username | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - immich_db_database | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - immich_db_storage_type in ['SSD', 'HDD']
      - immich_postgres_uid | string is match('^[0-9]+$')
      - immich_postgres_gid | string is match('^[0-9]+$')
      - immich_redis_uid | string is match('^[0-9]+$')
      - immich_redis_gid | string is match('^[0-9]+$')
      - immich_backup_path | default('') | trim | length > 0
      - immich_backup_schedule | default('') | trim | length > 0
      - immich_backup_retention_days | int > 0
      - immich_healthcheck_retries | int > 0
      - immich_healthcheck_delay | int > 0
    fail_msg: >-
      Define pinned Immich images, a valid hostname, database name/user, and a
      PostgreSQL storage type of SSD or HDD.

- name: Validate Immich database password
  ansible.builtin.assert:
    that:
      - immich_db_password | default('') | length > 0
      - immich_db_password is not search('[\r\n]')
    fail_msg: >-
      Define immich_db_password in Ansible Vault as a non-empty value without
      line breaks. Use printf, not echo, when encrypting it.

- name: Ensure Immich images are pulled
  docker_image:
    name: "{{ item }}"
    source: pull
  loop: "{{ immich_docker_images }}"

- name: Ensure Immich writable paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: '0750'
  loop:
    - { path: "{{ immich_upload_path }}", owner: root, group: root }
    - { path: "{{ immich_postgres_data_path }}", owner: "{{ immich_postgres_uid }}", group: "{{ immich_postgres_gid }}" }
    - { path: "{{ immich_redis_data_path }}", owner: "{{ immich_redis_uid }}", group: "{{ immich_redis_gid }}" }
    - { path: "{{ immich_ml_cache_path }}", owner: root, group: root }

- name: Ensure Immich backup path exists
  ansible.builtin.file:
    path: "{{ immich_backup_path }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: immich_backup_enabled | bool

- name: Ensure Immich environment file is installed
  ansible.builtin.template:
    src: immich/immich.env.j2
    dest: "{{ immich_env_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Ensure Immich backup script is installed
  ansible.builtin.template:
    src: immich/immich-backup.sh.j2
    dest: "{{ immich_backup_script_path }}"
    owner: root
    group: root
    mode: '0700'
  no_log: true
  when: immich_backup_enabled | bool

- name: Ensure Immich systemd services are installed
  ansible.builtin.template:
    src: "immich/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ immich_services_list }}"
  register: immich_systemd_services

- name: Ensure Immich backup systemd service is installed
  ansible.builtin.template:
    src: immich/immich-backup.service.j2
    dest: /etc/systemd/system/immich-backup.service
    owner: root
    group: root
    mode: '0644'
  when: immich_backup_enabled | bool

- name: Ensure Immich backup systemd timer is installed
  ansible.builtin.template:
    src: immich/immich-backup.timer.j2
    dest: /etc/systemd/system/immich-backup.timer
    owner: root
    group: root
    mode: '0644'
  when: immich_backup_enabled | bool

- name: Reload systemd after Immich service installation
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Ensure Immich backup timer is enabled
  ansible.builtin.systemd_service:
    name: immich-backup.timer
    enabled: true
    state: started
  when: immich_backup_enabled | bool
