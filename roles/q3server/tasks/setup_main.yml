---

- name: Ensure Q3server base path exists
  file:
    path: "{{ q3server_base_data_path }}"
    state: directory
    mode: '0750'
    owner: root
    group: root

- name: Ensure Q3server config path exists
  file:
    path: "{{ q3server_config_path }}"
    state: directory
    mode: '0750'
    owner: root
    group: root
