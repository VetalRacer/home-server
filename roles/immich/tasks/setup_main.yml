---
- name: Ensure Immich base path exists
  ansible.builtin.file:
    path: "{{ immich_base_data_path }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Check existence of Nginx-proxy network in Docker
  ansible.builtin.shell:
    cmd: "docker network ls -q --filter='name=^{{ nginx_docker_network }}$'"
  register: immich_nginx_docker_network
  changed_when: false
  check_mode: false

- name: Fail if Docker network is not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a Docker network (`{{ nginx_docker_network }}`) for
      using Immich.
  when: immich_nginx_docker_network.stdout == ''
