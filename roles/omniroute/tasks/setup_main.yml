---

- name: Ensure OmniRoute base path exists
  ansible.builtin.file:
    path: "{{ omniroute_base_data_path }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Check existence of Nginx-proxy network in Docker
  ansible.builtin.shell:
    cmd: "docker network ls -q --filter='name=^{{ nginx_docker_network }}$'"
  register: omniroute_nginx_docker_network
  changed_when: false
  check_mode: false

- name: Fail if Nginx-proxy Docker network is absent
  ansible.builtin.fail:
    msg: >-
      You need to define the Docker network `{{ nginx_docker_network }}` before
      installing OmniRoute.
  when: omniroute_nginx_docker_network.stdout == ''
