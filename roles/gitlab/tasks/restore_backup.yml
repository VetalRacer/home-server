---

- name: Validate GitLab backup archive name
  ansible.builtin.assert:
    that:
      - gitlab_archive_name is defined
      - gitlab_archive_name is match('^[A-Za-z0-9_.-]+_gitlab_backup[.]tar[.]gz$')
    fail_msg: >-
      Provide gitlab_archive_name as a basename of an archive created by this
      role; paths are not accepted.

- name: Ensure provided GitLab backup archive exists
  ansible.builtin.stat:
    path: "{{ gitlab_backup_directory }}/{{ gitlab_archive_name }}"
  register: gitlab_archive_path_host_stat

- name: Fail if provided GitLab backup archive does not exist
  ansible.builtin.fail:
    msg: "Backup archive cannot be found at {{ gitlab_backup_directory }}/{{ gitlab_archive_name }}"
  when: not gitlab_archive_path_host_stat.stat.exists

- name: Create a private GitLab restore staging directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ gitlab_base_path }}"
    prefix: restore-
  register: gitlab_restore_stage

- name: Extract GitLab backup archive into staging
  ansible.builtin.unarchive:
    src: "{{ gitlab_backup_directory }}/{{ gitlab_archive_name }}"
    dest: "{{ gitlab_restore_stage.path }}"
    remote_src: true

- name: Find the GitLab application backup in the archive
  ansible.builtin.find:
    paths: "{{ gitlab_restore_stage.path }}"
    patterns: '*_gitlab_backup.tar'
    file_type: file
    recurse: false
  register: gitlab_restored_application_backups

- name: Check for GitLab secrets in the archive
  ansible.builtin.stat:
    path: "{{ gitlab_restore_stage.path }}/config/gitlab-secrets.json"
  register: gitlab_restored_secrets

- name: Check for the managed GitLab environment file in the archive
  ansible.builtin.stat:
    path: "{{ gitlab_restore_stage.path }}/env-gitlab"
  register: gitlab_restored_env

- name: Validate GitLab backup archive contents
  ansible.builtin.assert:
    that:
      - gitlab_restored_application_backups.files | length == 1
      - gitlab_restored_secrets.stat.isreg | default(false)
      - gitlab_restored_env.stat.isreg | default(false)
    fail_msg: >-
      The archive is incomplete. It must contain one GitLab application backup
      config/gitlab-secrets.json, and env-gitlab.

- name: Set GitLab restore paths
  ansible.builtin.set_fact:
    gitlab_restore_application_backup: "{{ gitlab_restored_application_backups.files[0].path }}"
    gitlab_restore_application_backup_name: "{{ gitlab_restored_application_backups.files[0].path | basename }}"

- name: Determine GitLab version from the application backup
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - bash
      - -o
      - pipefail
      - -c
      - "tar -xOf {{ gitlab_restore_application_backup | quote }} backup_information.yml | awk '/:gitlab_version:/ {print $2; exit}'"
  changed_when: false
  register: gitlab_backup_version_result

- name: Validate GitLab backup version
  ansible.builtin.assert:
    that:
      - gitlab_backup_version_result.stdout is match('^[0-9]+[.][0-9]+[.][0-9]+-(ee|ce)$')
    fail_msg: Could not determine a supported GitLab version from backup_information.yml.

- name: Require the exact GitLab image version for restore
  ansible.builtin.assert:
    that:
      - gitlab_docker_image_tag == gitlab_backup_version_result.stdout + '.0'
    fail_msg: >-
      This backup is from {{ gitlab_backup_version_result.stdout }}, but the
      configured image tag is {{ gitlab_docker_image_tag }}. Restore using the
      exact image version before attempting an upgrade.

- name: Restore GitLab configuration and SSH host keys
  ansible.builtin.copy:
    src: "{{ item.source }}/"
    dest: "{{ item.destination }}/"
    owner: root
    group: root
    remote_src: true
  loop:
    - source: "{{ gitlab_restore_stage.path }}/config"
      destination: "{{ gitlab_config_dir_path }}"
    - source: "{{ gitlab_restore_stage.path }}/ssh"
      destination: "{{ gitlab_data_ssh_dir_path }}"

- name: Restore the managed GitLab environment file
  ansible.builtin.copy:
    src: "{{ gitlab_restore_stage.path }}/env-gitlab"
    dest: "{{ gitlab_env_path }}"
    owner: root
    group: root
    mode: '0600'
    remote_src: true

- name: Ensure restored GitLab private files have restrictive permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ gitlab_config_dir_path }}/gitlab-secrets.json"
      mode: '0600'
    - path: "{{ gitlab_data_ssh_dir_path }}"
      mode: '0700'

- name: Start GitLab for restore
  ansible.builtin.systemd_service:
    name: gitlab.service
    state: started

- name: Wait for GitLab container to be available
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - gitlab
      - gitlab-ctl
      - status
  changed_when: false
  register: gitlab_restore_status
  retries: 30
  delay: 10
  until: gitlab_restore_status.rc == 0

- name: Copy GitLab application backup into the container volume
  ansible.builtin.copy:
    src: "{{ gitlab_restore_application_backup }}"
    dest: "{{ gitlab_source_backups_dir_path }}/{{ gitlab_restore_application_backup_name }}"
    owner: root
    group: root
    mode: '0600'
    remote_src: true

- name: Grant GitLab access to the application backup
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - gitlab
      - chown
      - git:git
      - "/var/opt/gitlab/backups/{{ gitlab_restore_application_backup_name }}"

- name: Stop GitLab web and background workers for restore
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - gitlab
      - gitlab-ctl
      - stop
      - "{{ item }}"
  loop:
    - puma
    - sidekiq

- name: Restore GitLab application data
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - gitlab
      - gitlab-backup
      - restore
      - "BACKUP={{ gitlab_restore_application_backup_name | regex_replace('_gitlab_backup[.]tar$', '') }}"
      - force=yes

- name: Reconfigure GitLab after restore
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - gitlab
      - gitlab-ctl
      - reconfigure

- name: Restart GitLab after restore
  ansible.builtin.systemd_service:
    name: gitlab.service
    state: restarted

- name: Verify restored GitLab secrets
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - gitlab
      - gitlab-rake
      - gitlab:doctor:secrets
  changed_when: false

- name: Remove GitLab restore staging directory
  ansible.builtin.file:
    path: "{{ gitlab_restore_stage.path }}"
    state: absent
