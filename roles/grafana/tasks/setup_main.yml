---

- name: Ensure Grafana base path exists
  ansible.builtin.file:
    path: "{{ grafana_base_data_path }}"
    state: directory
    # The container runs as UID 472 and must traverse this directory to read
    # the root-owned, read-only provisioning tree. Sensitive files inside it
    # (grafana.env) have their own 0600 mode.
    mode: '0755'
    owner: root
    group: root

- name: Check existence of Nginx-proxy network in Docker
  shell:
    cmd: "docker network ls -q --filter='name=^{{ nginx_docker_network }}$'"
  register: nginx_result_docker_network
  changed_when: false

- name: Fail if docker network not defined
  fail:
    msg: >-
      You need to define a docker network (`{{ nginx_docker_network }}`) for using this service.
  when: nginx_result_docker_network.stdout == ''
