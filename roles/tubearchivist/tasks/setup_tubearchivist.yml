---

- name: Validate TubeArchivist configuration
  ansible.builtin.assert:
    that:
      - tubearchivist_docker_image_tag | default('') | trim | length > 0
      - tubearchivist_redis_docker_image_tag | default('') | trim | length > 0
      - tubearchivist_es_docker_image_tag | default('') | trim | length > 0
      - tubearchivist_service_hostname | default('') is match('^\\S+$')
      - tubearchivist_service_port | int > 0
      - tubearchivist_service_port | int <= 65535
      - tubearchivist_uid | string is match('^[0-9]+$')
      - tubearchivist_gid | string is match('^[0-9]+$')
      - tubearchivist_username | default('') | length > 0
      - tubearchivist_password | default('') | length > 0
      - tubearchivist_es_password | default('') | length > 0
      - tubearchivist_password is not search('[\\r\\n]')
      - tubearchivist_es_password is not search('[\\r\\n]')
      - tubearchivist_es_java_heap is match('^[1-9][0-9]*[mMgG]$')
    fail_msg: >-
      Define valid image tags, hostname, service port, numeric UID/GID values,
      non-empty credentials without line breaks, and an Elasticsearch heap size.
  no_log: true

- name: Ensure TubeArchivist image is pulled
  docker_image:
    name: "{{ tubearchivist_docker_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"

- name: Ensure TubeArchivist-Redis image is pulled
  docker_image:
    name: "{{ tubearchivist_redis_docker_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"

- name: Ensure TubeArchivist_ES image is pulled
  docker_image:
    name: "{{ tubearchivist_es_docker_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"

- name: Ensure TubeArchivist paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0750
    owner: "{{ tubearchivist_uid }}"
    group: "{{ tubearchivist_gid }}"
  with_items:
    - "{{ tubearchivist_media }}"
    - "{{ tubearchivist_cache }}"

- name: Ensure TubeArchivist_Redis paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0750
    owner: "root"
    group: "root"
  with_items:
    - "{{ tubearchivist_redis_data }}"

- name: Ensure TubeArchivist_ES paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0750
    owner: 1000
    group: "root"
  with_items:
    - "{{ tubearchivist_es_data }}"

- name: Ensure TubeArchivist environment file installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/tubearchivist/tubearchivist.env.j2"
    dest: "{{ tubearchivist_env_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Ensure TubeArchivist systemd services installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/tubearchivist/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  with_items: "{{ tubearchivist_services_list }}"
  register: tubearchivist_systemd_service_result

- name: Ensure systemd reloaded after TubeArchivist service installation
  ansible.builtin.systemd_service:
    daemon_reload: yes
  when: tubearchivist_systemd_service_result.changed
