# Base directory that contains everything
pgadmin_base_data_path: "{{ services_base_data_path }}/pgadmin"

# pgAdmin edition
pgadmin_docker_image_template: "dpage/pgadmin4:__VERSION__"
pgadmin_docker_image: "{{ pgadmin_docker_image_template|replace('__VERSION__', pgadmin_docker_image_tag) }}"

# pgAdmin-related data
pgadmin_data_path: "{{ pgadmin_base_data_path }}/data"
pgadmin_env_path: "{{ pgadmin_base_data_path }}/pgadmin.env"

# The official image runs pgAdmin as UID 5050 in group root.
pgadmin_uid: "5050"
pgadmin_gid: "0"
pgadmin_disable_postfix: true
# Port 80 requires NET_BIND_SERVICE. The container intentionally runs without
# capabilities, so pgAdmin listens on an unprivileged internal port instead.
pgadmin_service_port: 8080

# pgAdmin services
pgadmin_services_list: |
  {{
    (['pgadmin.service'])
  }}
