---

- import_tasks: "{{ role_path }}/tasks/setup_main.yml"
  when: torrserver_installation_enabled|bool == true
  tags:
    - setup-all
    - setup-torrserver

- import_tasks: "{{ role_path }}/tasks/setup_torrserver.yml"
  when: torrserver_installation_enabled|bool == true
  tags:
    - setup-torrserver
    - setup-all

- import_tasks: "{{ role_path }}/tasks/start.yml"
  when: torrserver_installation_enabled|bool == true
  tags:
    - start
    - start-torrserver
