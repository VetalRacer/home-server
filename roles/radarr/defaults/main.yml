# Base directory that contains everything
radarr_base_data_path: "{{ services_base_data_path }}/radarr"

# Radarr edition
radarr_docker_image_template: "lscr.io/linuxserver/radarr:__VERSION__"
radarr_docker_image: "{{ radarr_docker_image_template|replace('__VERSION__', radarr_docker_image_tag) }}"

# Radarr-related data
radarr_data_path: "{{ radarr_base_data_path }}/data"

# Radarr config data
radarr_config_path: "{{ radarr_data_path }}/config"

# Shared media tree. It is mounted as /data so Radarr can hardlink imports
# from the same filesystem as Transmission downloads.
radarr_storage_path: "{{ sharefolder_base_data_path }}"
radarr_movies_path: "{{ radarr_storage_path }}/media/movies"
radarr_downloads_path: "{{ radarr_storage_path }}/torrent/downloads"

# Radarr runtime configuration
radarr_uid: "1000"
radarr_gid: "100"
radarr_service_port: 7878
radarr_umask: "002"

# Radarr services
radarr_services_list: |
  {{
    (['radarr.service'])
  }}
