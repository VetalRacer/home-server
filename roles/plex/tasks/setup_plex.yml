---

- name: Validate Plex configuration
  assert:
    that:
      - plex_uid | int > 0
      - plex_gid | int > 0
      - plex_service_port | int > 0
      - plex_service_port | int < 65536
      - plex_claim | default('') is not search('[\\r\\n]')
    fail_msg: >-
      Define valid non-root Plex UID/GID values, a valid service port, and a
      claim token without line breaks.
  no_log: true

- name: Ensure Plex image is pulled
  docker_image:
    name: "{{ plex_docker_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"

- name: Ensure Plex paths exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
    owner: "{{ plex_uid }}"
    group: "{{ plex_gid }}"
  with_items:
    - "{{ plex_data_path }}"

- name: Ensure Plex claim environment file
  template:
    src: "{{ role_path }}/templates/plex/plex.env.j2"
    dest: "{{ plex_env_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Ensure Plex.service installed
  template:
    src: "{{ role_path }}/templates/plex/plex.service.j2"
    dest: "/etc/systemd/system/plex.service"
    mode: 0644
  register: plex_systemd_service_result

- name: Ensure systemd reloaded after plex.service installation
  service:
    daemon_reload: yes
  when: plex_systemd_service_result.changed
