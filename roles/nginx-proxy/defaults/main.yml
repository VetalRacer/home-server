---

# nginx-proxy automatically renders virtual hosts from Docker metadata.
# Use the maintained image namespace and an explicitly pinned release.
nginx_proxy_docker_image_template: "nginxproxy/nginx-proxy:__VERSION__"
nginx_proxy_docker_image: "{{ nginx_proxy_docker_image_template|replace('__VERSION__', nginx_proxy_docker_image_tag) }}"

# A list of extra arguments to pass to the container
nginx_proxy_container_extra_arguments: []

# Nginx-related data
nginx_proxy_base_path: "{{ services_base_data_path }}/nginx-proxy"
nginx_proxy_data_path: "{{ nginx_proxy_base_path }}/data"
nginx_proxy_confd_path: "{{ nginx_proxy_base_path }}/conf.d"

# Bind HTTP only to the primary LAN interface. Override only on a multi-homed
# host; the default intentionally preserves access from every device in that
# LAN while avoiding an automatic IPv6/public listener.
nginx_proxy_listen_address: "{{ ansible_default_ipv4.address | default('') }}"
nginx_proxy_http_port: 80
nginx_proxy_worker_processes: auto
nginx_proxy_worker_connections: 1024
nginx_proxy_client_max_body_size: 1g

# Samba services
nginx_proxy_services_list:
  - nginx-proxy.service
