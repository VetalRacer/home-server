---

- name: Validate Sonarr configuration
  assert:
    that:
      - sonarr_uid | int > 0
      - sonarr_gid | int > 0
      - sonarr_service_port | int > 0
      - sonarr_service_port | int < 65536
      - sonarr_umask is match('^[0-7]{3,4}$')
      - sonarr_service_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - sonarr_storage_path == sharefolder_base_data_path
      - sonarr_tv_path is match('^' ~ (sonarr_storage_path | regex_escape) ~ '/.+')
      - sonarr_downloads_path is match('^' ~ (sonarr_storage_path | regex_escape) ~ '/.+')
    fail_msg: >-
      Define non-root Sonarr UID/GID values, a valid hostname, port and umask,
      and keep the Sonarr storage paths beneath the share root.

- name: Check Sonarr downloads path exists
  stat:
    path: "{{ sonarr_downloads_path }}"
  register: sonarr_downloads_path_result
  changed_when: false

- name: Validate Sonarr downloads path
  assert:
    that:
      - sonarr_downloads_path_result.stat.isdir | default(false)
    fail_msg: >-
      Sonarr downloads path must exist and be a directory:
      {{ sonarr_downloads_path }}. Run the Transmission setup first.

- name: Ensure Sonarr image is pulled
  docker_image:
    name: "{{ sonarr_docker_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"

- name: Ensure Sonarr paths exist
  file:
    path: "{{ item }}"
    state: directory
    mode: 0750
    owner: "{{ sonarr_uid }}"
    group: "{{ sonarr_gid }}"
  with_items:
    - "{{ sonarr_data_path }}"
    - "{{ sonarr_config_path }}"

- name: Ensure Sonarr TV library path exists
  file:
    path: "{{ sonarr_tv_path }}"
    state: directory
    owner: "{{ sonarr_uid }}"
    group: "{{ sonarr_gid }}"
    mode: '2770'

- name: Ensure sonarr.service installed
  template:
    src: "{{ role_path }}/templates/sonarr/sonarr.service.j2"
    dest: "/etc/systemd/system/sonarr.service"
    mode: 0644
  register: sonarr_systemd_service_result

- name: Ensure systemd reloaded after sonarr.service installation
  service:
    daemon_reload: yes
  when: sonarr_systemd_service_result.changed
