# ps3netsrv edition
ps3netsrv_docker_image_template: "shawly/ps3netsrv:__VERSION__"
ps3netsrv_docker_image: "{{ ps3netsrv_docker_image_template|replace('__VERSION__', ps3netsrv_docker_image_tag) }}"

# ps3netsrv-related data
ps3netsrv_game_path: "{{ sharefolder_base_data_path }}/game/ps3"

# ps3netsrv network and filesystem configuration
ps3netsrv_service_port: 38008
ps3netsrv_listen_address: "{{ ansible_default_ipv4.address | default('') }}"
ps3netsrv_games_read_only: true

# ps3netsrv runs as this non-root host identity. It matches the default
# Samba admin:users account and must be able to read ps3netsrv_game_path.
ps3netsrv_uid: "1000"
ps3netsrv_gid: "100"

# ps3netsrv services
ps3netsrv_services_list: |
  {{
    (['ps3netsrv.service'])
  }}
